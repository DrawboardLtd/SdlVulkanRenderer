name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Major bump 4.1 -> 5.0: multi-page SDF glyph atlas. The atlas is now a list of fixed-size
  # page textures (default 2048²); a full page appends a new page instead of reallocating, so
  # glyph-atlas growth no longer does a vkDeviceWaitIdle + image realloc + re-upload (the visible
  # frame stall). Internal change to VkSdfFontAtlas + the SDF draw path; the public VkRenderer API
  # is source-compatible (the optional sdfInitialAtlasDim param now sizes a page).
  # 5.1: VkRenderer overrides DIR.Lib's PushClip/PopClip → Vulkan scissor (needs DIR.Lib >= 4.4).
  # Major bump 5.1 -> 6.0: multi-window foundation. Device-level Vulkan state split out of
  # VulkanContext into a shareable VulkanDevice; new SdlVulkanApp owns SDL + one VkInstance + one
  # shared device across windows; SdlVulkanWindow gains an app-path factory + WindowId;
  # VulkanContext.CreateForSharedDevice builds a swapchain against an existing device. Single-window
  # source-compatible (Create / CreateOffscreen unchanged), but the new app/window/device layering
  # is the intended multi-window entry point.
  # 6.3: OnPinch passes a PinchSource (touchpad vs touchscreen) — needs DIR.Lib >= 4.6.
  # 6.4: DIR.Lib 5.0 (surface-agnostic layout/menu subsystem); VkMenuWidget dropped
  #      (superseded by DIR.Lib PixelMenuWidget).
  # 6.5: DIR.Lib 5.1 (markdown image nodes) — dependency repin only.
  # 6.6: live-device thumbnail capture (VulkanContext.ThumbnailCapture + VkRenderer
  #      BeginThumbnailCapture/EndThumbnailCapture/TryGetThumbnailCapture) — re-issues already-
  #      tessellated geometry into an offscreen target at thumbnail scale, non-blocking readback.
  #      Plus SDF atlas per-page LRU eviction (replaces EvictAll thrash) + bounded disk-load drain.
  # 6.7: DIR.Lib 5.2 (font family+style by-name resolution) — dependency repin only.
  # 6.8: map SDL Alpha0 ('0' key) to InputKey.D0 (was landing one past D9).
  # 6.9: DIR.Lib 6.0 (DIR.Lib.Layout namespace + Builder DSL + Node.Split) — dependency repin only.
  # 6.10: DIR.Lib 6.1 (embedded Type1 PFB/raw-FontFile glyph rendering) — dependency repin only.
  # 6.11: describe_layout inspector core (GetLayout option + arranged-tree serialization); DIR.Lib 6.2.
  # 6.12: DIR.Lib 6.3 (BackgroundTaskTracker.RunGuarded) — dependency repin only.
  # 6.13: MTSDF glyph rendering — R8 SDF atlas -> 4-channel MTSDF (median(r,g,b) shader), atlas keyed
  #       by resolved glyph identity (GID for OpenType, PostScript name for Type1) instead of
  #       (Rune, charCode); .sdfg disk format -> v4. Public glyph API stays source-compatible (the
  #       (Rune, charCode, GlyphMapHint) methods resolve to identity internally); by-GID variants
  #       (GetGlyphByGid / PreWarmSdfGlyphByGid) added. DIR.Lib 6.8.
  # 6.14: SdlVulkanWindow.GetNativeWindowHandle (native HWND/NSWindow/wl_surface for hosting
  #       native child surfaces) + the SdlVulkan.Renderer.Inspector project source (MCP bridge;
  #       carried as source only — not in the .sln, consumed via the published dnx tool).
  # 6.15: GPU-wedge resilience. Stuck-fence recovery now runs on a sacrificial background task the
  #       render thread only polls (on a truly hung GPU the driver can block INSIDE vkFreeMemory /
  #       teardown — observed on Adreno 2026-07-10: the old synchronous recovery froze the render
  #       thread permanently); deadline blown or repeated stuck escalations → OnGpuWedged (new host
  #       callback) + clean loop stop. SDF atlas: per-frame upload BYTE budget alongside the glyph
  #       count cap (MTSDF quadrupled bytes/glyph vs R8), one-frame quarantine for glyphs on a
  #       just-appended page (first transition and first sample no longer share a submission), and
  #       a FrameStats wedge breadcrumb logged at fence-stuck escalation.
  # 6.16: idle the render loop while a window is minimized. A minimized window reports a non-zero
  #       pixel size on Windows, so the old size guard never caught it and the loop busy-spun through
  #       swapchain recreation (~270ms/frame) for invisible frames. Gate redraw on the SDL minimized
  #       flag (SdlVulkanWindow.IsMinimized): ~0% CPU while minimized, instant repaint on restore.
  #       DEBUG-only: inspector minimize/maximize/restore commands + a per-iteration command pump
  #       (SdlEventLoop.OnLoopIteration) so commands drain on a minimized window.
  VERSION_PREFIX: 6.16.${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5
