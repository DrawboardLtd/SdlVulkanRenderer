name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Minor bump 4.0 -> 4.1: anisotropic glyph rendering. Glyph draw/batch APIs
  # gain an optional `xScale` parameter that stretches the output quad along
  # the writing direction (atlas glyph itself stays at the uniform fontSize).
  # Enables correct rendering when text-rendering-matrix |M11| differs from
  # |M22| — e.g. PDFs that condense titles via /Tz or anisotropic Tm/cm.
  # Source-compatible: existing callers default to xScale = 1f.
  VERSION_PREFIX: 4.1.${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5
