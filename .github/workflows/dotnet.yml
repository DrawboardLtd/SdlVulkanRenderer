name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Release notes for the chain, one entry per Major.Minor. The version NUMBER is deliberately not
  # here any more — it lives in src/Directory.Build.props (VersionMajorMinor) and the build job reads
  # it back, so it cannot drift from what the packages declare. Add the entry here when you bump it
  # there. (The entries stay in the yml rather than moving next to the number because several contain
  # `--`, which is illegal inside an XML comment.)
  # Major bump 4.1 -> 5.0: multi-page SDF glyph atlas. The atlas is now a list of fixed-size
  # page textures (default 2048²); a full page appends a new page instead of reallocating, so
  # glyph-atlas growth no longer does a vkDeviceWaitIdle + image realloc + re-upload (the visible
  # frame stall). Internal change to VkSdfFontAtlas + the SDF draw path; the public VkRenderer API
  # is source-compatible (the optional sdfInitialAtlasDim param now sizes a page).
  # 5.1: VkRenderer overrides DIR.Lib's PushClip/PopClip → Vulkan scissor (needs DIR.Lib >= 4.4).
  # 6.0: multi-window — one VulkanDevice shared across windows (SdlVulkanApp); VulkanContext split into
  #      device-level (VulkanDevice) + per-window state; multi-window SdlEventLoop. Breaking: standalone
  #      consumers move to SdlVulkanApp. Adds opt-in SDF glyph disk cache + window placement/morph API.
  # 6.4: rebuilt against DIR.Lib 5.0 (layout engine + PixelMenuWidget); removes VkMenuWidget
  #      (superseded by DIR.Lib's surface-agnostic PixelMenuWidget).
  # 6.5: live-device thumbnail capture (VulkanContext.ThumbnailCapture + VkRenderer
  #      BeginThumbnailCapture/EndThumbnailCapture/TryGetThumbnailCapture) — re-issues already-
  #      tessellated geometry into an offscreen target at thumbnail scale, non-blocking readback.
  #      Plus SDF atlas per-page LRU eviction (replaces EvictAll thrash) + bounded disk-load drain.
  # 6.7: lockstep rebuild against DIR.Lib 6.0 (layout namespace + Layout.Builder DSL).
  # 6.8: inspector render-thread watchdog -- render_liveness MCP tool + ProbeRenderAsync (ALIVE/BLOCKED/DEAD
  #      via a short-budget ping that round-trips ON the render thread; detects a wedged render loop).
  # 6.9: inspector describe_layout MCP tool -- serializes the FULL arranged DIR.Lib.Layout tree (depth +
  #      kind + rect + content/bg/hit chrome), not just the clickable subset describe_ui shows. Needs
  #      DIR.Lib's ArrangedNode.Depth + PixelWidgetBase.GetCapturedLayout + LayoutInspection (DIR.Lib 6.0.x).
  # 6.15: shaped-text GID-direct atlas fetch. DrawText/MeasureText now honor ShapedGlyph.Glyph (the
  #       substituted glyph id from an ITextShaper -- GSUB ligatures, Arabic joined forms, ...),
  #       fetching the SDF/bitmap atlas by glyph id instead of the source codepoint. Adds
  #       VkFontAtlas/VkSdfFontAtlas.GetGlyphByGid + VkRenderer.PreWarmSdfGlyphByGid. Opt-in via
  #       renderer.TextShaper (e.g. DIR.Lib.Shaping's ShapingTextShaper); the default AdvanceShaper
  #       per-rune path is byte-identical to before. Bumps DIR.Lib pin 6.5 -> 6.6.
  # 6.16: re-pin DIR.Lib 6.6 -> 6.8. DIR.Lib 6.8's DIR.Lib.Shaping satellite is rebuilt against
  #       SharpAstro.Fonts.Shaping 1.5.551 (Fonts.Lib F6 zero-alloc bidi + F7 HarfBuzz-style
  #       coverage-digest lookup skipping, ~3-4x faster shaping). Renderer core is unchanged; apps
  #       that plug DIR.Lib.Shaping's ShapingTextShaper into renderer.TextShaper get the speedup.
  # 6.17: GPU-wedge resilience. Stuck-fence recovery now runs on a sacrificial background task the
  #       render thread only polls (on a truly hung GPU the driver can block INSIDE vkFreeMemory /
  #       teardown — observed on Adreno: the old synchronous recovery froze the render thread
  #       permanently); deadline blown or repeated stuck escalations → OnGpuWedged (new host
  #       callback) + clean loop stop. SDF atlas: per-frame upload BYTE budget alongside the glyph
  #       count cap (MTSDF quadrupled bytes/glyph vs R8), one-frame quarantine for glyphs on a
  #       just-appended page (first transition and first sample no longer share a submission), and
  #       a FrameStats wedge breadcrumb logged at fence-stuck escalation.
  # 6.18: idle the render loop while a window is minimized. A minimized window reports a non-zero
  #       pixel size on Windows, so the old size guard never caught it and the loop busy-spun through
  #       swapchain recreation (~270ms/frame) for invisible frames. Gate redraw on the SDL minimized
  #       flag (SdlVulkanWindow.IsMinimized): ~0% CPU while minimized, instant repaint on restore.
  #       DEBUG-only: inspector minimize/maximize/restore commands + a per-iteration command pump
  #       (SdlEventLoop.OnLoopIteration) so commands drain on a minimized window.
  # 6.19: opt-in Vulkan validation diagnostics (VulkanValidation). The Khronos validation layer's
  #       output was previously enabled in DEBUG but dropped to the loader's default sink; now a
  #       debug-utils messenger routes it to a prefixed stderr line + a bounded ring buffer. Adds an
  #       opt-in SYNCHRONIZATION validation switch (the GPU memory-hazard checker behind the wedge
  #       class) and a validation_report inspector/MCP tool. Gated: DEBUG or SDLVK_VALIDATION=1
  #       (+ SDLVK_SYNC_VALIDATION=1 for sync); zero cost + no layer in a normal Release build.
  # 6.30: DeviceTransform GPU compose (needs DIR.Lib 6.17). VkRenderer.DeviceTransform folds the
  #       content->device affine into the projection in UpdateProjection — the compose stays a
  #       Matrix3x2 (2D affine, no wasted lanes) and only widens to the mat4 push-constant at upload,
  #       so the whole frame (text included) rotates/scales as one. Identity transform is byte-
  #       identical to the previous screen-space projection. Verified via offscreen render + readback
  #       (180° flip moves a top-left fill to the bottom-right).
  # 6.33: VkRenderer.FillRoundedRectangle — a real GPU override of DIR.Lib 6.20's scanline fallback:
  #       one rounded-box SDF quad per rect with antialiased corners, single-coverage so a translucent
  #       fill blends exactly once. New roundrect.vert/.frag + RoundRectPipeline. The box parameters
  #       (half extents, radius) ride on VERTEX ATTRIBUTES, not push constants, so the shared 84-byte
  #       push block stays byte-identical across every pipeline — growing it for one pipeline is the
  #       per-stage mismatch ellipse.vert documents as an llvmpipe shader-compiler SEGV. A zero radius
  #       delegates to FillRectangle, so the square path is untouched.
  # 7.0: DeviceTransform is a ContentTransform (needs DIR.Lib 7.0) — both the type and the VkRenderer
  #      property are renamed, so a consumer that sets it must rename too.
  # 7.1: no reflective JSON in the MCP sidecar either — source-generated binding, AOT-clean.
  # 7.2: the inspector REFUSES an unrecognised `mods` string instead of resolving it to None. Resolving
  #      the unknown to None delivered a BARE key, and a bare key is frequently a different valid
  #      binding rather than a no-op, so a typo surfaced as the app IGNORING a correct chord rather than
  #      as a bad request. A partial match still resolves, so a chord that CAN be delivered is never
  #      blocked. ResolveModifier / ResolveInputKey are internal with InternalsVisibleTo the tests.
  # 7.3: DebugInspector folds onto DIR.Lib's DebugInspectorCore (needs DIR.Lib 7.3), 940 -> ~600 lines.
  #      Gone are the private TCP accept loop, the newline framing, the discovery responder, the command
  #      queue, the InspectorCommand hierarchy with its parser, and the batch/wait state machine — all
  #      duplicated what the core does. What stays is what is actually SDL: the verbs,
  #      ResolveInputKey/ResolveModifier, and pressHold as a background operation (pressed in Begin,
  #      released in Advance, deliberately NOT exclusive so a screenshot can be taken mid-hold).
  #      SECURITY: BindAddress defaulted to IPAddress.Any, so a command server that injects input,
  #      captures the framebuffer and reads app state accepted connections from the whole LAN. The core
  #      binds LOOPBACK with no opt-out.
  #      ONE discovery protocol: `dir-inspect` on 239.255.77.91:47892, was `sdlvk-inspect` on
  #      239.255.77.90:47891. A sidecar tells surfaces apart by the `kind` field ("sdl") rather than by
  #      which port answered, and moves in lockstep — an OLDER sidecar will not find the app.
  #      BREAKING, in DEBUG builds only: DebugInspectorOptions loses BindAddress, Port, DiscoveryGroup
  #      and DiscoveryPort. The core owns addressing, so they could only be accepted-and-ignored, and a
  #      `Port = 5000` that silently does nothing is worse than one that fails to compile. The whole
  #      type is #if DEBUG, so it is ABSENT from the published Release package — only a local Debug
  #      build against the sibling can hit this. EnableDiscovery survives.
  #      ping answers the core's {"ok":true,"protocol":N,"app":"..."} rather than the bare "pong".
  # 7.4 - lockstep rebuild against DIR.Lib 7.4. No renderer code change. DIR.Lib gains per-axis
  #      PixelMeasureContext scales plus a CellAuthored factory, so a cell-authored tree arranges on a
  #      pixel surface, and PixelWidgetBase Arrange/Paint/RenderLayout gain overloads taking the measure
  #      context itself — the painter reads FontPath/FontScale/radius from the same object the measure
  #      pass used, rather than a dpiScale threaded into both by hand. Additive: the scalar overloads
  #      delegate with an isotropic context, so this renderer paints byte-identically.
  # 7.5 - lockstep rebuild against DIR.Lib 7.5. No renderer code change. DIR.Lib now resolves installed
  #      fonts by the family each face DECLARES rather than by a guessed file name, so a face whose file
  #      isn't named after it resolves (Segoe UI Symbol lives in seguisym.ttf) and so does every face of
  #      a .ttc past the first — both previously unreachable. Those are named by FontFaceId
  #      (path, or path#index for a collection), which ManagedFontRasterizer honours; since the id is
  #      already every glyph/atlas/shaper cache key, faces separate without further plumbing.
  #      FontFallbackResolver gains TryResolveFont/CanRender and role-based construction, and
  #      PixelWidgetBase.FontFallback carries per-run fallback into the declarative painter. Additive.
  # 7.6 - descriptor sets and samplers stop being a fixed budget. The descriptor pool was created once with
  #      maxSets 512 and treated as a hard ceiling, so a page carrying a few thousand small images ran the
  #      device out — and since the glyph atlas draws from the same pool, the allocation refused could be
  #      TEXT as easily as an image. Pools cannot be resized, so growth is by chaining: VulkanDevice adds a
  #      pool when the current one is spent. Freed sets are recycled rather than returned to the driver
  #      (every set shares one combined-image-sampler layout, so a returned set is re-pointed at another
  #      image), which also keeps handles valid instead of invalidating one an in-flight command buffer may
  #      still name, and keeps the pool count tracking PEAK live sets rather than growing with churn.
  #      VkTexture no longer creates a sampler each — identical settings every time, no per-image state, and
  #      thousands of them walked into maxSamplerAllocationCount as a second ceiling behind the first; one
  #      shared VulkanDevice.LinearClampSampler replaces them. NEW: DrawTexturedQuadRegion draws an
  #      arbitrary quad from a UV sub-rect, so many small images can share one atlas texture. FIX: a failed
  #      page allocation in the SDF backend left its image and memory behind. Lockstep with DIR.Lib 7.6.
  #      ADDITIVE.
  # 7.7 - lockstep rebuild against DIR.Lib 7.7. No renderer code change. A layout tree can now state a
  #      hyperlink, and a text run which end it trims (new DIR.Lib TextTrim); ten dangling <see cref>
  #      targets in DIR.Lib's own docs now resolve. DIR.Lib's SharpAstro.LALR.CC pin also moves 3.1.* ->
  #      4.7.*, which only ever bound CI — a local build swaps it for the sibling ProjectReference, which
  #      is how it sat a major behind unnoticed. ADDITIVE.
  # 7.9 - GPU-WEDGE ROOT CAUSE, plus the forensics that found it. Four parts, one release.
  #      (1) wedge forensics: the breadcrumb logged when a fence sticks now carries device-object churn
  #      (buffer/image/memory create+free since the frame that hung, counted on VulkanDevice and noted
  #      by VkTexture) and the idle gap since the last clean frame — a field wedge arrived with the
  #      atlas half of the breadcrumb reading all zeros and the actual churn had to be dug out of host
  #      logs. The "fence late" line carries the gap too, so recovered episodes are data points as
  #      well. NEW: VulkanDevice.ChurnCounters/DeviceChurn, VkRenderer.DeviceChurnBreadcrumb. ADDITIVE.
  #      (2) a frame's fence is now reset immediately before the submit that signals it, instead of in
  #      BeginFrame. Everything in between — atlas flush/grow, texture uploads, the consumer's whole
  #      render callback — used to run with a fence only EndFrame could signal, so any exit that
  #      skipped EndFrame orphaned it permanently and the next BeginFrame waited on a fence nothing
  #      would ever signal: indistinguishable from a hung GPU, but with the GPU idle. Same fix on the
  #      offscreen path, where the wait is unbounded and the hang therefore permanent. Added
  #      VulkanContext.AbortFrame (resolve a frame abandoned mid-way, so its acquire semaphore and
  #      image do not leak into the next), VK_ERROR_DEVICE_LOST now reported distinctly instead of as
  #      a generic VkException, and a submission ledger on the wedge breadcrumb that states whether
  #      the fence being waited on ever had work submitted under it. Queue/command-pool external
  #      synchronization is asserted (single-owner submission) rather than locked. NEW:
  #      VulkanContext.AbortFrame/SubmissionLedger/DeviceLost, VkRenderer.AbortFrame/SubmissionLedger.
  #      ADDITIVE.
  #      (3) the actual root cause of the field wedges, caught live by the ledger above:
  #      Adreno's spec-illegal VK_ERROR_INITIALIZATION_FAILED from vkQueueSubmit is a REAL rejection
  #      (the work never executes; the old tolerance believed it did), so a rejected submit is now a
  #      dropped frame: fence left unmarked and never waited on (a fence with no submission behind it
  #      cannot signal — waiting on it WAS the wedge), present skipped, acquire semaphore replaced,
  #      pending thumbnail capture cancelled, frame index advanced. The stuck-fence recovery drain now
  #      runs even in stuck mode (it is on the sacrificial task, and destroying sync objects a slow
  #      frame still references is what poisoned the driver into rejecting), and all drains skip
  #      fences with nothing pending.
  #      (4) the renderer's unconditional diagnostics (wedge forensics, recovery decisions,
  #      driver anomalies) now log through an injectable ILogger: SdlVulkanLog.Logger (defaults to a
  #      stderr sink so unwired hosts keep today's output — the breadcrumbs are the black box and
  #      must not be droppable by omission), with every message a [LoggerMessage] source-generated
  #      event (compile-time templates, IsEnabled-gated, allocation-free; ids 1xx event loop,
  #      2xx context, 3xx readback, 4xx validation). Templates reproduce the exact former stderr
  #      text, so log-grepping tooling is unaffected. RenderDiag stays [Conditional("DEBUG")] raw
  #      stderr. NEW dependency: Microsoft.Extensions.Logging.Abstractions (interface-only). NEW:
  #      SdlVulkanLog. ADDITIVE.
  #      Later in 7.9, no X.Y bump: AssemblyVersion is now DERIVED from VersionMajorMinor for every
  #      project instead of being restated as a literal per csproj, and the DIR.Lib pin moves 7.5.* ->
  #      7.8.* to match upstream. Both come down from upstream, which had already corrected them. The
  #      AssemblyVersion half matters most: CI stamps -p:Version and -p:FileVersion but NOT
  #      -p:AssemblyVersion, so where a stale VersionPrefix only spoiled a local pack, a stale
  #      AssemblyVersion SHIPPED — SdlVulkan.Renderer published 6.11.0.0 and both WebView packages
  #      6.0.0.0 right through 7.9, each against an informational version a major or more ahead. All
  #      three are now 7.9.0.0. Deliberately not a minor bump: the value only moves UP, and the runtime
  #      rejects a loaded assembly LOWER than the compiled reference, never higher, so anything already
  #      built against 6.11.0.0 or 6.0.0.0 keeps loading.
  # 7.10 - lockstep rebuild against DIR.Lib 7.8 (submodule 7.7 -> 7.8). No renderer code change; the
  #       CPM pin already tracked 7.8.*, so CI was restoring 7.8 while a local build used the 7.7
  #       submodule — this closes that split. BEHAVIOUR CHANGE flowing through from DIR.Lib, not
  #       additive: the PIXEL painter now fits every text run to the rect the layout engine arranged for
  #       it, so a run left on the default TextTrim.End ellipsizes where it used to start at the rect
  #       edge and overhang its neighbour. TextTrim.Shrink (scale down, keep every character) and
  #       TextTrim.None (the previous overhang) are available for callers that want the old shape.
  #       DIR.Lib 7.8 also derives AssemblyVersion from its version property, fixing the same
  #       ships-the-wrong-identity bug this repo had: DIR.Lib and DIR.Lib.Shaping had published 6.4.0.0
  #       since 6.5.
  # 7.11 - rebuild against DIR.Lib 7.9: a PDF font's own /Encoding now decides which glyph a char
  #        code selects, so embedded name-keyed CFF subsets stop drawing unrelated glyphs. Carries
  #        SharpAstro.Fonts 1.8, which loads PDF subset fonts whose cmap a subsetter malformed
  #        (previously the whole font was rejected and every glyph fell back to a system face).
  #        No renderer API change.
  # 7.12 - offscreen rendering survives a rejected queue submit instead of hanging on it. The dropped
  #        frame handling added in 7.9 covered the swapchain path only, so on hardware that returns
  #        VK_ERROR_INITIALIZATION_FAILED from vkQueueSubmit an offscreen frame threw, and threw before
  #        advancing the frame index — leaving that fence reset with nothing behind it to signal it, so
  #        the next offscreen frame waited on it forever with no timeout. A TIFF export or thumbnail
  #        capture of a heavy page could therefore hang outright. Offscreen submits now retry a
  #        rejection (the frame IS the output, so it is retried rather than dropped) and a submit that
  #        never took is recorded as such, so no wait can park on an unsignalable fence. Readback does
  #        the same and fails loudly rather than returning an unwritten buffer as pixels. Also fixes the
  #        swapchain path leaving a stale pending mark when a rejection followed an earlier successful
  #        submit on the same frame index. No API change.
  # 7.13 - the inspector says what a refused request was missing, and a batch step and a direct call
  #        accept the same parameters. Brings the inspector request parsing in line with upstream, which
  #        had moved on: readers now NAME the parameter they wanted instead of surfacing GetProperty's
  #        "The given key was not present in the dictionary", which reached the caller as the entire
  #        explanation of a refused step and said nothing about which step, which parameter, or what
  #        would have worked. `text` accepts either the batch contract's spelling or the `s` the direct
  #        verb has always sent, and postSignal reads args as an object OR argsJson as a string -- a
  #        batch step passing argsJson previously reported success and then did nothing, because every
  #        field fell back to its default, and for a set-view signal whose fields all mean "leave
  #        unchanged" that is indistinguishable from working. DEBUG-only surface; 12 tests come with it.
  # 7.14 - BeginThumbnailCapture takes the clear colour instead of assuming white. The capture target was
  #        cleared to a hard-coded (1,1,1,1) "white page background", which is fine while every page is
  #        white and wrong the moment a consumer renders a dark one: the ink inverts, the sheet does not,
  #        so the thumbnail comes back as light text on white paper and reads as a bug in the ink. Now
  #        explicit, matching BeginOffscreenFrame, which has always taken its clear colour. Breaking for
  #        direct callers of BeginThumbnailCapture / BeginThumbnailCapturePass -- pass white to keep the
  #        old behaviour.
  # 7.15 - rebuild against DIR.Lib 7.10: TabBar's colours are a palette rather than private static
  #        fields, so a host can theme the tab strip, and TabBarColors.FromPalette derives that palette
  #        from the UiPalette chrome roles a host may already hold. No renderer code change; the pin
  #        moves so consumers building through this submodule see the new API.
  # 7.16 - rebuild against DIR.Lib 7.11: BREAKING for anyone constructing a UiPalette. It gains eight
  #        roles and becomes a sealed record with required members, so default(UiPalette) — every role
  #        transparent black, painted silently — is now a compile error instead. Five of the new roles
  #        derive from the role they extend. Note HeaderText moved from required to derived-from-Accent:
  #        a palette that omits it gets the accent, so a near-white header colour has to stay stated
  #        rather than falling out of the port. No renderer code change; the pin moves so consumers
  #        building through this submodule see the new API. See DIR.Lib's MIGRATION.md.
  # 7.17 - a space moves the pen. An ink-free glyph keeps its own hmtx advance now (DIR.Lib 7.11
  #        submodule bump), and VkFontAtlas caches that blank entry rather than discarding it, so a
  #        glyph with no pixels stops re-entering rasterization on every draw. Text laid out through
  #        the bitmap atlas gets the font's real space width where it used to get the 'n' glyph's —
  #        visibly narrower, and correct. Text laid out by glyph id (any shaped run) gets a space at
  #        all, where it previously ran every word together.
  # 7.18 - dependency refresh, no renderer code change. Vortice.Vulkan 3.2.1 -> 3.2.3 is the only one
  #        a consumer sees, and it moves in TWO places: the CPM file here and an inline pin in
  #        SdlVulkan.Renderer.Tests, which sits outside src/SdlVulkan.Renderer/ and so is out of that
  #        Directory.Packages.props' scope. Bumping one alone fails restore on NU1605. Also
  #        Microsoft.Extensions.Logging.Abstractions 10.0.0 -> 10.0.10, SourceLink 10.0.300 ->
  #        10.0.301, and a DIR.Lib submodule bump carrying the same kind of refresh.
  # 7.19 - the Inspector follows SharpAstro.Png 3.4 -> 3.8, and the hashed shader sources are pinned
  #        `-text` in a new .gitattributes. The bake check compares source hashes against
  #        Shaders/spirv/sources.sha256, which makes those files' exact bytes part of the build
  #        contract — with no .gitattributes, core.autocrlf could rewrite them on checkout and SVR0001
  #        would fire on a tree nobody had edited. Re-baking is the WRONG response to that: the
  #        recorded hashes are right and the SPIR-V is byte-identical, so committing hashes taken from
  #        CRLF bytes only moves the warning to Linux. Submodule bump for DIR.Lib's matching refresh.
  # 7.20 - rebuild against DIR.Lib 7.12: TextInputRenderer takes a palette, the same shape TabBar got
  #        in 7.10 — a TextInputColors record whose defaults are what it has always drawn, a
  #        FromPalette factory, and a settable TextInputRenderer.Colors. Additive: a consumer that
  #        sets nothing is unchanged. No renderer code change; the pin moves so consumers building
  #        through this submodule see the new API.
  # 7.21 - rebuild against DIR.Lib 7.13, which follows SharpAstro.Fonts 1.11. No renderer code
  #        change, no API change — but GLYPH SELECTION changes, so text can draw differently.
  #        An embedded PDF subset whose only cmap subtable is Mac Roman (1,0) now selects through
  #        it rather than falling back to treating the char code as a glyph index. macOS Quartz
  #        writes exactly that shape, and the guess failed two ways at once: inside a large subset
  #        it picked an unrelated glyph (Korean body text drew as correctly-shaped nonsense in
  #        codepoint-sorted order), and in a 2-20 glyph Latin subset it indexed off the end and
  #        drew nothing (commas, list markers and page numbers vanished). Also carried in from the
  #        skipped 1.10 pin: three compounding TrueType hint-interpreter fixes and RTL mark
  #        attachment. Consumers rasterizing text through an unhinted path (e.g. MTSDF atlases)
  #        see no baseline movement from the hinting half.
  # 7.22 - rebuild against DIR.Lib 7.14: a glyph the SDF atlas can never rasterize is given up on
  #        after three attempts and recorded blank, instead of being retried forever. No renderer
  #        code change. What changes for a consumer is the failure MODE of a broken font: previously
  #        the atlas re-claimed such a glyph every frame and IsDirty never cleared, so
  #        VkRenderer.FontAtlasDirty stayed true for the session — an event loop redrew forever and
  #        an offscreen capture waited out its whole frame budget, reporting a pixel difference with
  #        nothing about fonts anywhere in it. Now the glyph draws as nothing, the atlas reports
  #        clean, and one line per font names the glyph, the attempts, and whether the font was
  #        registered when we gave up. Also brings ManagedFontRasterizer.IsFontRegistered.
  # 7.23 - the fallout of one device-loss investigation, plus a rebuild against DIR.Lib 7.15.
  #        Five renderer changes had landed on main since 7.22 WITHOUT a version, so they were
  #        publishing as 7.22 build-counter republishes; this bump is what gives them one. Four of
  #        the five are things the validation layer had been unable to tell us, because on a host
  #        with no Khronos layer installed it was never actually running (see below).
  #        VK_ERROR_DEVICE_LOST is now TERMINAL rather than entering mid-frame recovery. Recovery
  #        rebuilds sync and the swapchain and continues, which cannot work once the device and every
  #        object it owns are gone: each later call returns DEVICE_LOST again, so the rebuild re-failed
  #        on the next submit. Three attempts burned inside 34ms, and the right outcome (hand the
  #        session to a successor) was reached only because the recover-streak detector happened to
  #        trip. That detector logs a "recovery storm" and asks the app to shed load, which reads as a
  #        workload problem and points diagnosis away from a dead device. Event 110 "Recovering
  #        swapchain" is now logged only for errors that path can actually recover; new event 115 names
  #        device loss for what it is.
  #        Each swapchain image gets its OWN present-wait semaphore. render-finished was allocated per
  #        frame in flight and indexed by frame slot, but vkQueuePresentKHR's wait completes only when
  #        the presentation engine is done with the IMAGE, and image count is not bounded by
  #        MaxFramesInFlight, so with more images than frames a new submit could re-signal a semaphore
  #        an earlier present was still waiting on (VUID-vkQueueSubmit-pSignalSemaphores-00067). Its
  #        lifetime moves onto the swapchain so a resize that changes the image count rebuilds it.
  #        Latent while presentation is regular, which is why it surfaced over Remote Desktop.
  #        ONE shared subpass-dependency pair, in VulkanDevice.FillSubpassDependencies, used by all six
  #        creation sites. Every pass had written its own: render-pass compatibility covers
  #        dependencies, so pre-baked pipelines drawing in a pass with a different dependency count
  #        were rejected (VUID-vkCmdDraw-renderPass-02684, "2 != 1"). And every external dependency
  #        used srcAccessMask = 0, which orders execution but creates no memory dependency against the
  #        previous frame's storeOp write, so the layout transition raced it, a WRITE_AFTER_WRITE
  #        hazard on every alternating pair of frames. srcAccessMask is now ColorAttachmentWrite.
  #        Diagnostics that were lying: validationReport now reports layerAvailable and active, not
  #        just the DEBUG + SDLVK_VALIDATION gate. On a host with no Khronos layer installed it read
  #        enabled:true with zero messages and zero hazards, indistinguishable from a clean run, and
  #        was read as one during the very investigation above. A zero message count is evidence only
  #        when active is true. The sync-hazard counter matched only the retired "SYNC-HAZARD" token
  #        and so reported zero while the ring buffer plainly held WRITE_AFTER_WRITE messages.
  #        And a DiscreteGpu PREFERENCE (never a requirement, so integrated-only hosts are
  #        unaffected): both pickers took the first device meeting their requirements, so a machine
  #        with both cards ran on whatever the loader enumerated first, possibly integrated graphics on
  #        shared memory. New event 501 records device name, type, driver version, API version, queue
  #        family and how many devices were enumerated. Nothing had logged the selection, so no GPU
  #        report could be attributed to hardware from our own logs.
  #        Then the rebuild: DIR.Lib 7.15 makes TextFit.ShrinkToWidth return a size it actually
  #        measured, so a run fitted with TextTrim.Shrink stops drawing a fraction of a pixel past its
  #        rect. Shrink is opt-in and the default is End, so a consumer that never asks for it renders
  #        byte-identically. That release also records, late, a behaviour change that shipped
  #        unannounced in DIR.Lib 7.12 (this repo's 7.20): a whitespace advance comes from the font
  #        instead of being borrowed from the 'n' glyph, and in DejaVu every measured space had been
  #        1.99x too wide. Text laid out with space padding is therefore narrower since 7.20; U+2007
  #        FIGURE SPACE is the pad that holds a column, being digit-width by definition.
  # 7.24 - Rebuild on DIR.Lib 7.16, whose TabBar can draw a "+" after the last tab and report its click
  #        (ShowNewTabButton / NewTabActive / NewTabHovered / HitNewTabButton). Additive there and here:
  #        nothing in this repo consumes it, and a consumer that sets nothing is unchanged. Bumped so the
  #        viewer can pin a renderer whose DIR.Lib carries the button, rather than reaching around the
  #        chain for it.
  # 7.25 - Additive, two things. SdlVulkanWindow.SetIcon(RgbaImage) sets the window's icon: title bar,
  #        taskbar or dock button, alt-tab entry (synced from upstream SdlVulkan.Renderer 7.12). Not a
  #        Windows convenience, since a Win32 icon resource in the exe covers Windows and nothing else:
  #        X11 and Wayland read the icon off the window. SDL copies the pixels, so the caller's array is
  #        free on return. And DIR.Lib 7.17, whose TabBar takes a Pointer position and hovers itself from
  #        it: the tab under the pointer lifts, and its close mark plates. Both additive; a consumer that
  #        calls neither is unchanged. The viewer consumes both.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's
  # first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    # Published for the test job, so the version is resolved ONCE per run rather than each job
    # re-deriving it.
    outputs:
      version-prefix: ${{ steps.version.outputs.prefix }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      id: version
      # Read the version back from the one place it is written (src/Directory.Build.props) instead of
      # restating it here — CI stamps -p:Version across every package, so a hard-coded copy here could
      # ship packages whose version disagrees with the one they declare. -getProperty only EVALUATES
      # the file: nothing is built and no restore is needed, so this can run before restore.
      # The value is CAPTURED, so nothing else may print to stdout: DOTNET_NOLOGO (workflow env) keeps
      # the SDK first-run banner out — this is the job's first dotnet call — and the shape check makes
      # anything else unexpected, or a renamed property, fail the run rather than quietly stamping
      # every package ".<run>".
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
        echo "prefix=${MM}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
    - name: Install Android workload
      # This job opts into the android host TFM (BuildAndroidHost=true below) to compile + pack it,
      # so it needs the android workload. ubuntu runners already ship the Android SDK + JDK.
      run: dotnet workload install android
    - name: Restore dependencies
      run: dotnet restore -p:BuildAndroidHost=true
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:BuildAndroidHost=true -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  # BlendOpRegressionTests catch the dangling-pAttachments bug fixed in 3.4.471 by
  # round-tripping VkBlendOp.Min / Max through actual draw calls. Need a Vulkan ICD on the
  # runner; Mesa lavapipe (software) is the standard headless choice. fail-fast: false so a
  # regression on one architecture doesn't mask the other.
  #
  # vulkan-validationlayers is installed too so SyncValidationGlyphFloodTests runs (not skips):
  # it renders an SDF glyph flood offscreen under VK_LAYER_KHRONOS_validation with SYNCHRONIZATION
  # validation on and asserts no read-after-write hazard. Sync validation flags the atlas
  # upload/sample hazard STATICALLY, so lavapipe reproduces it deterministically where the vendor
  # hang (Adreno) never would. timeout-minutes bounds a genuine wedge (the test has its own
  # 60s in-process deadman on top).
  test:
    needs: build
    timeout-minutes: 15
    # Inherited from the build job rather than resolved again — same run, same version.
    env:
      VERSION_PREFIX: ${{ needs.build.outputs.version-prefix }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: SharpAstro/cache-apt-pkgs-action@v1
      with:
        packages: mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
        version: 1.1
    # If the loader can't enumerate at least one ICD, the tests will Assert.Skip via
    # TryCreateOffscreenContext rather than fail. This diagnostic surfaces that situation
    # (and whether the validation layer is present, for the sync-validation test) in the build
    # log without a re-run.
    - name: Vulkan ICD + layer summary
      run: |
        vulkaninfo --summary || true
        echo "--- instance layers ---"
        vulkaninfo 2>/dev/null | grep -iA1 "VK_LAYER_KHRONOS_validation" || echo "validation layer NOT visible to loader"
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      # net10.0 only (BuildAndroidHost unset → renderer is net10.0), so no android workload needed here.
      run: dotnet restore
    - name: Build test project
      # Only the test project (net10.0) — NOT the whole solution: building the net10.0-android TFM needs
      # the Android SDK, which the ubuntu-24.04-arm runner doesn't ship (ubuntu-latest x64 does). The
      # tests are net10.0 offscreen Vulkan, so the android TFM is irrelevant here (the build job packs it).
      run: dotnet build src/SdlVulkan.Renderer.Tests -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test src/SdlVulkan.Renderer.Tests -c $BUILD_CONF --no-build --logger "console;verbosity=detailed"

  # Headless functional smoke for the Linux WebView backend (GtkWebView / WebKitGTK). Runs two
  # network-free self-tests (tools/WebViewSmoke) inside a real SDL X11 window under Xvfb: `assert`
  # (two-way messaging: page->host + host->page + navigation + JS execution) and `assert-autosize`
  # (the WebViewContentSizer content->host channel). Each exits 0/1 deterministically (it _exit()s
  # past WebKitGTK's atexit teardown, which otherwise aborts with 134). The harness SKIPs (exit 0)
  # when the display / WebKitGTK / Vulkan stack is
  # unavailable, mirroring BlendOpRegressionTests' Assert.Skip-on-no-ICD. Non-gating for now (not
  # in publish-nuget's needs) until proven stable across runners. If a runner's Mesa does not
  # auto-fall-back to software, add LIBGL_ALWAYS_SOFTWARE=1 + WEBKIT_DISABLE_DMABUF_RENDERER=1 below.
  webview-smoke-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Plain apt-get (not cache-apt-pkgs-action): the cache action installs only the named packages
    # without their dependencies, so mesa-vulkan-drivers landed without the driver libs its ICD needs
    # -> "vkCreateInstance: Found no drivers" (-9). apt-get resolves dependencies and installs the ICD.
    - name: Install WebKitGTK + software Vulkan + Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: WebView messaging self-test (headless via Xvfb)
      run: >-
        xvfb-run -a -s "-screen 0 1280x800x24"
        env SDL_VIDEODRIVER=x11
        dotnet run --project tools/WebViewSmoke/WebViewSmoke.csproj -f net10.0 -c $BUILD_CONF assert
    - name: WebView content-sizer self-test (headless via Xvfb)
      # Exercises WebViewContentSizer: the page reports its content height (content->host), and the
      # assert proves the height shrinks below the initial once the box is shrunk — i.e. shrink-to-fit
      # below the webview viewport works. Same skip-on-no-GUI / deterministic-exit semantics as above.
      run: >-
        xvfb-run -a -s "-screen 0 1280x800x24"
        env SDL_VIDEODRIVER=x11
        dotnet run --project tools/WebViewSmoke/WebViewSmoke.csproj -f net10.0 -c $BUILD_CONF assert-autosize
